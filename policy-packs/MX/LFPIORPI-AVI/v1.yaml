pack: MX/LFPIORPI-AVI
version: 1
title: "LFPIORPI — actividad vulnerable fracción XVI (activos virtuales)"
effective_from: 2026-11-30
country: MX
regulators: [SAT, UIF]
products: [CRYPTO]
units: {quote_ccy: MXN, tier_limit_rule: null}
kyc:
  tiers: []
  review_frequency: {}
