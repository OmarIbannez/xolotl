# Money that leaves about as fast as it arrives: a mule account (spec §9.3).
version: 1
country_code: MX
packs: [MX/ITF-IFPE, MX/LFPIORPI-AVI]
definition:
  code: RAPID_PASS_THROUGH
  family: ALERT
  kind: AGGREGATE
  title: Paso rápido de fondos
  typology: [MULE]
  "on": {direction: [OUT]}
  unit_key: USD/PRIOR_BANKING_DAY
  params:
    min_in: {value: "2000", unit: USD}
  aggregates:
    - name: in_sum
      function: SUM
      measure: UNIT_AMOUNT
      unit_key: USD/PRIOR_BANKING_DAY
      key_kind: RELATIONSHIP
      window_kind: DURATION
      window: P2D
      where: {direction: [IN]}
    - name: out_sum
      function: SUM
      measure: UNIT_AMOUNT
      unit_key: USD/PRIOR_BANKING_DAY
      key_kind: RELATIONSHIP
      window_kind: DURATION
      window: P2D
      where: {direction: [OUT]}
  conditions:
    - {aggregate: out_sum, op: GTE, ratio_of: in_sum, ratio: "0.9"}
    - {aggregate: in_sum, op: GTE, threshold: min_in}
  severity: MEDIUM
  dedup: {key: RELATIONSHIP, window: P2D, cooldown: P7D}
  evidence: {transactions_window: P2D, aggregates: [in_sum, out_sum]}
