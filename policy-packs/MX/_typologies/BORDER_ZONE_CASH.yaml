# Cash operated in the northern border states (spec §9.3); BORDER_ZONE_MX is the
# region list of policy-packs/_jurisdictions.yaml (UNVERIFIED, plan 4b Open question 2).
version: 1
country_code: MX
packs: [MX/ITF-IFPE]
definition:
  code: BORDER_ZONE_CASH
  family: ALERT
  kind: AGGREGATE
  title: Efectivo en la zona fronteriza
  typology: [STRUCTURING]
  "on": {instrument: [CASH], geo_admin_area_in: [$BORDER_ZONE_MX]}
  unit_key: USD/PRIOR_BANKING_DAY
  params:
    min_cash_sum: {value: "3000", unit: USD}
  aggregates:
    - name: cash_sum
      function: SUM
      measure: UNIT_AMOUNT
      unit_key: USD/PRIOR_BANKING_DAY
      key_kind: RELATIONSHIP
      window_kind: DURATION
      window: P30D
      where: {instrument: [CASH], geo_admin_area_in: [$BORDER_ZONE_MX]}
  conditions:
    - {aggregate: cash_sum, op: GTE, threshold: min_cash_sum}
  severity: MEDIUM
  dedup: {key: RELATIONSHIP, window: P30D, cooldown: P7D}
  evidence:
    transactions_window: P30D
    transactions_where: {instrument: [CASH], geo_admin_area_in: [$BORDER_ZONE_MX]}
    aggregates: [cash_sum]
