# Many distinct senders paying into one relationship (spec §9.3).
version: 1
country_code: MX
packs: [MX/ITF-IFPE]
definition:
  code: MANY_TO_ONE_FUNNEL
  family: ALERT
  kind: AGGREGATE
  title: Embudo de muchos a uno
  typology: [MULE]
  "on": {direction: [IN]}
  unit_key: USD/PRIOR_BANKING_DAY
  params:
    min_counterparties: {value: 10}
    min_in: {value: "5000", unit: USD}
  aggregates:
    - name: distinct_counterparties_in
      function: DISTINCT_COUNT
      measure: ONE
      unit_key: null
      key_kind: RELATIONSHIP
      window_kind: DURATION
      window: P7D
      where: {direction: [IN]}
      distinct_of: COUNTERPARTY
    - name: in_sum
      function: SUM
      measure: UNIT_AMOUNT
      unit_key: USD/PRIOR_BANKING_DAY
      key_kind: RELATIONSHIP
      window_kind: DURATION
      window: P7D
      where: {direction: [IN]}
  conditions:
    - {aggregate: distinct_counterparties_in, op: GTE, threshold: min_counterparties}
    - {aggregate: in_sum, op: GTE, threshold: min_in}
  severity: MEDIUM
  dedup: {key: RELATIONSHIP, window: P7D, cooldown: P7D}
  evidence:
    transactions_window: P7D
    transactions_where: {direction: [IN]}
    aggregates: [distinct_counterparties_in, in_sum]
