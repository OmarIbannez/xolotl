# FATF lists, ISO 3166-1 alpha-2. Copy both lists from fatf-gafi.org on the day you
# write this file and put that day in as_of; the grey list changes every plenary.
# Lists of the FATF statements of 19 June 2026 (June 2026 plenary), checked on
# 2026-10-19 against the fatf-gafi.org pages "Jurisdictions under Increased Monitoring -
# 19 June 2026" and "High-Risk Jurisdictions subject to a Call for Action - 19 June 2026"
# (fatf-gafi.org refuses automated reads, so the pages were read in the Internet Archive
# captures of 2026-10-01 and 2026-10-07; the black-and-grey-lists page captured on
# 2026-10-13 still lists the June statements). The October 2026 plenary sits
# 26-30 October 2026 (fatf-gafi.org events calendar): re-check the lists after it.
as_of: 2026-06-19
source: "FATF, High-risk jurisdictions subject to a call for action; Jurisdictions under increased monitoring (fatf-gafi.org)"
confidence: VERIFIED
call_for_action: [KP, IR, MM]
increased_monitoring: [AO, BO, BA, BG, CM, CI, CD, HT, IQ, KE, KW, LA, LB, MC, NP, PG, SS, SY, VE, VN, VG, YE]
# No tax-haven source has been chosen yet (plan 4b Open question 1): the set is empty,
# and a rule naming $TAX_HAVEN is refused when its rule set loads until a source is
# named here (an empty set would otherwise place no condition at all).
tax_haven: []
# The default of plan 4b Open question 2: the six states on the northern border as
# ISO 3166-2 codes (Baja California, Sonora, Chihuahua, Coahuila, Nuevo León,
# Tamaulipas). The customs definition (the 20 km strip) would need municipality codes.
regions_confidence: UNVERIFIED
regions:
  BORDER_ZONE_MX: [MX-BCN, MX-SON, MX-CHH, MX-COA, MX-NLE, MX-TAM]
