# Formato 41 integrated layout (Anexo 1 of the resolution, DOF 14-12-2004 as
# reformed to DOF 01-08-2013), shared by MX_F41_ROR, MX_F41_ROI, MX_F41_ROI24 and
# MX_F41_ROIP. Report-type codes: 1 relevante, 2 inusual, 3 preocupante.
#
# VERIFIED from the source: the 41 columns, their order, widths and types; the
# separator; upper case; truncation of over-long values; columns 14 and 34-41 not
# applying to relevantes; 29-33 only for insurers, sureties and money
# transmitters (always empty here).
# UNVERIFIED (layout_confidence): whether a record ends with a separator, the
# line ending, and the shape of the reporte vacío (empty_report_columns). The
# resolution requires an empty report (Art. 2) but does not print it.
#
# Column 23 is required for every type: the resolution makes it mandatory for
# inusuales and preocupantes and, from 1 April 2005, extends the 21-23 rules to
# relevantes "en los mismos términos". Column 36 may hold an SAT-assigned key, so
# it is a CODE, not NUMERIC.
#
# overflow ERROR is used where truncating would change an identifier or a code;
# the layout's truncation rule is kept for free text.
name: MX_F41.v1
sources: [F41_RESOLUTION]
separator: ";"
trailing_separator: false
line_ending: CRLF
layout_confidence: UNVERIFIED
empty_report_columns: [1, 2, 4, 5]
columns:
  - {number: 1, name: TIPO DE REPORTE, field: tipo_reporte, kind: CODE, width: 1, overflow: ERROR, code_table: MX/f41_tipo_reporte, report_types: ["1", "2", "3"], required_for: ["1", "2", "3"]}
  - {number: 2, name: PERIODO DEL REPORTE, field: periodo, kind: NUMERIC, width: 8, overflow: ERROR, report_types: ["1", "2", "3"], required_for: ["1", "2", "3"]}
  - {number: 3, name: FOLIO, field: folio, kind: NUMERIC, width: 6, overflow: ERROR, report_types: ["1", "2", "3"], required_for: ["1", "2", "3"]}
  - {number: 4, name: ORGANO SUPERVISOR, field: organo_supervisor, kind: NUMERIC, width: 6, overflow: ERROR, report_types: ["1", "2", "3"], required_for: ["1", "2", "3"]}
  - {number: 5, name: CLAVE DEL SUJETO OBLIGADO, field: clave_sujeto_obligado, kind: NUMERIC, width: 8, overflow: ERROR, report_types: ["1", "2", "3"], required_for: ["1", "2", "3"]}
  - {number: 6, name: LOCALIDAD, field: localidad, kind: CODE, width: 8, overflow: ERROR, report_types: ["1", "2", "3"], required_for: ["1", "2", "3"]}
  - {number: 7, name: SUCURSAL, field: sucursal, kind: CODE, width: 8, overflow: ERROR, report_types: ["1", "2", "3"], required_for: ["1", "2", "3"]}
  - {number: 8, name: TIPO DE OPERACION, field: tipo_operacion, kind: CODE, width: 2, overflow: ERROR, code_table: MX/f41_tipo_operacion, report_types: ["1", "2", "3"], required_for: ["1", "2", "3"]}
  - {number: 9, name: INSTRUMENTO MONETARIO, field: instrumento_monetario, kind: CODE, width: 2, overflow: ERROR, code_table: MX/f41_instrumento_monetario, report_types: ["1", "2", "3"], required_for: ["1", "2", "3"]}
  - {number: 10, name: NUMERO DE CUENTA, field: numero_cuenta, kind: CODE, width: 16, overflow: ERROR, report_types: ["1", "2", "3"], required_for: ["1", "2", "3"]}
  - {number: 11, name: MONTO, field: monto, kind: DECIMAL, width: 17, overflow: ERROR, report_types: ["1", "2", "3"], required_for: ["1", "2", "3"]}
  - {number: 12, name: MONEDA, field: moneda, kind: CODE, width: 3, overflow: ERROR, report_types: ["1", "2", "3"], required_for: ["1", "2", "3"]}
