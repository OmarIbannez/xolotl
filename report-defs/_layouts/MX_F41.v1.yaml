  - {number: 29, name: AGENTE NOMBRE RAZON SOCIAL O DENOMINACION, field: agente_nombre, kind: TEXT, width: 60, report_types: ["1", "2", "3"]}
  - {number: 30, name: AGENTE APELLIDO PATERNO, field: agente_apellido_paterno, kind: TEXT, width: 60, report_types: ["1", "2", "3"]}
