# Groups of given names that refer to the same person: a formal name with its
# common Spanish hypocoristics, and English equivalents where they are routine in
# cross-border records. Folded single words (compound names such as Chema for José
# María are left to the fuzzy matcher). A name may sit in several groups (Beto is
# both Roberto and Alberto). Changing this file bumps MATCHER_VERSION.
