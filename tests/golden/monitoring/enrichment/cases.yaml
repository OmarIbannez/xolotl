# Enrichment goldens (SP-04 spec §7, plan 4a A6), over tests/golden/units/values.yaml
# and Mexico's BANXICO holidays, with ITF assigned to EMONEY and AVI to CRYPTO.
#
# A `units` operation runs unit_amounts_for. Its pairs are either the policy's
# (`product`: unit_pairs of the snapshot for the operation's date and product) or
# listed (`pairs`), for dates no pack is in force on or whose other values the
# fixture does not hold. `expected` is the unit_amounts JSON, each `row` naming the
# unit_value row read as [unit_code, valid_from] (null for an identity), or `park`
# for the ParkTransactionError raised. A `periods` operation runs period_keys_for.
- id: uma-change-31-jan-vs-1-feb
  note: two AVI crypto operations a day apart read different UMA rows (108.57, 113.14)
  operations:
    - kind: units
      on: 2025-01-31
      amount: "25000.00"
      currency: MXN
      pairs: [UMA/SAME_DAY]
      expected:
        MXN/SAME_DAY: {amount: "25000.00", row: null, resolved_date: "2025-01-31"}
        UMA/SAME_DAY: {amount: "230.266188", row: [UMA, 2024-02-01], resolved_date: "2025-01-31"}
    - kind: units
      on: 2025-02-01
      amount: "25000.00"
      currency: MXN
      pairs: [UMA/SAME_DAY]
      expected:
        MXN/SAME_DAY: {amount: "25000.00", row: null, resolved_date: "2025-02-01"}
        UMA/SAME_DAY: {amount: "220.965176", row: [UMA, 2025-02-01], resolved_date: "2025-02-01"}

- id: fix-prior-banking-day-across-12-dec
  note: 12 December 2025 is a Banxico holiday; both transfers read the FIX of the 11th
  operations:
    - kind: units
      on: 2025-12-15
      amount: "5000.00"
      currency: USD
      pairs: [USD/PRIOR_BANKING_DAY]
      expected:
        MXN/PRIOR_BANKING_DAY: {amount: "91250.00", row: [USD_MXN_FIX, 2025-12-11], resolved_date: "2025-12-11"}
        MXN/SAME_DAY: {amount: "91250.00", row: [USD_MXN_FIX, 2025-12-11], resolved_date: "2025-12-11"}
        USD/PRIOR_BANKING_DAY: {amount: "5000.00", row: null, resolved_date: "2025-12-15"}
    - kind: units
      on: 2025-12-12
      amount: "5000.00"
      currency: USD
      pairs: [USD/PRIOR_BANKING_DAY]
      expected:
        MXN/PRIOR_BANKING_DAY: {amount: "91250.00", row: [USD_MXN_FIX, 2025-12-11], resolved_date: "2025-12-11"}
        MXN/SAME_DAY: {amount: "91250.00", row: [USD_MXN_FIX, 2025-12-11], resolved_date: "2025-12-11"}
        USD/PRIOR_BANKING_DAY: {amount: "5000.00", row: null, resolved_date: "2025-12-12"}

- id: udi-last-day-prev-month-january
  note: the ITF tier limits read the UDI of 31 December for a January operation
  operations:
    - kind: units
      on: 2026-01-20
      amount: "10000.00"
      currency: MXN
      product: EMONEY
      expected:
        MXN/SAME_DAY: {amount: "10000.00", row: null, resolved_date: "2026-01-20"}
        UDI/LAST_DAY_PREV_MONTH: {amount: "1173.708920", row: [UDI, 2025-12-31], resolved_date: "2025-12-31"}
        UDI/SAME_DAY: {amount: "1161.440186", row: [UDI, 2026-01-20], resolved_date: "2026-01-20"}
        USD/PRIOR_BANKING_DAY: {amount: "540.540541", row: [USD_MXN_FIX, 2026-01-19], resolved_date: "2026-01-19"}

- id: udi-missing-parks
  note: no UDI row for 31 January 2026; the first missing pair in sorted order parks
  operations:
    - kind: units
      on: 2026-02-05
      amount: "10000.00"
      currency: MXN
      product: EMONEY
      park: {reason: UNIT_VALUE_MISSING, unit_code: UDI, needed_on: "2026-01-31"}

- id: quarter-at-the-year-boundary
  note: Mexico City is UTC-6, so 05:30Z on 1 January is still 31 December
  operations:
    - kind: periods
      occurred_at: "2026-01-01T05:30:00Z"
      expected: {DAY: "2025-12-31", MONTH: "2025-12", QUARTER: "2025-Q4", BUSINESS_DAY: true}
    - kind: periods
      occurred_at: "2026-01-01T06:00:00Z"
      expected: {DAY: "2026-01-01", MONTH: "2026-01", QUARTER: "2026-Q1", BUSINESS_DAY: false}

- id: business-day-flag
  note: the Banxico holiday of 12 December 2025 and the Monday after it
  operations:
    - kind: periods
      occurred_at: "2025-12-12T18:00:00Z"
      expected: {DAY: "2025-12-12", MONTH: "2025-12", QUARTER: "2025-Q4", BUSINESS_DAY: false}
    - kind: periods
      occurred_at: "2025-12-15T18:00:00Z"
      expected: {DAY: "2025-12-15", MONTH: "2025-12", QUARTER: "2025-Q4", BUSINESS_DAY: true}
